<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 48 200 106" role="img" aria-label="쌓인 책과 커피잔">
  <!-- 바닥 그림자 -->
  <ellipse cx="100" cy="146" rx="88" ry="6" fill="#e3f0fc"/>

  <!-- 맨 아래 책 -->
  <rect x="18" y="112" width="120" height="30" rx="4" fill="#1d3a5f"/>
  <rect x="24" y="117" width="108" height="20" rx="2" fill="#f7f6f3"/>
  <rect x="18" y="112" width="12" height="30" rx="3" fill="#2f5d8f"/>

  <!-- 가운데 책 -->
  <rect x="28" y="86" width="104" height="26" rx="4" fill="#7fb3e6"/>
  <rect x="34" y="91" width="92" height="16" rx="2" fill="#ffffff"/>
  <line x1="44" y1="99" x2="100" y2="99" stroke="#7fb3e6" stroke-width="2" stroke-linecap="round"/>

  <!-- 맨 위 책 (살짝 기울임) -->
  <g transform="rotate(-6 80 74)">
    <rect x="26" y="62" width="108" height="24" rx="4" fill="#0f6e6e"/>
    <rect x="32" y="67" width="96" height="14" rx="2" fill="#e3f1f0"/>
  </g>

  <!-- 책갈피 -->
  <path d="M112 86 v18 l5 -4 l5 4 v-18 z" fill="#f2a65a"/>

  <!-- 커피잔 -->
  <path d="M148 110 h36 l-4 32 h-28 z" fill="#ffffff" stroke="#1d3a5f" stroke-width="3" stroke-linejoin="round"/>
  <path d="M182 116 h6 a8 8 0 0 1 0 16 h-8" fill="none" stroke="#1d3a5f" stroke-width="3"/>
  <rect x="152" y="118" width="28" height="6" fill="#7fb3e6"/>

  <!-- 김 -->
  <path d="M158 102 q-5 -8 0 -16 q5 -8 0 -16" fill="none" stroke="#7fb3e6" stroke-width="3" stroke-linecap="round"/>
  <path d="M172 102 q-5 -8 0 -16 q5 -8 0 -16" fill="none" stroke="#7fb3e6" stroke-width="3" stroke-linecap="round"/>
</svg>
