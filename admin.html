<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>관리 페이지</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="admin">
  <header class="topbar">
    <div class="wrap">
      <a class="logo" href="./">관리 페이지</a>
      <a class="btn small ghost" href="./">공개 페이지</a>
    </div>
  </header>

  <main class="wrap">
    <section class="gate card" id="gate">
      <h3>관리 비밀번호</h3>
      <p>구글 시트에서 정한 관리 비밀번호를 입력하세요.</p>
      <input type="password" id="code" placeholder="관리 비밀번호">
      <button class="btn" id="enter">들어가기</button>
    </section>

    <section id="console" class="hidden">
      <div class="notice" id="notice"></div>
      <div class="actions" style="margin-bottom:8px">
        <button class="btn small ghost" id="refresh">새로 불러오기</button>
        <a class="btn small ghost hidden" id="open-sheet" target="_blank" rel="noopener">구글 시트 열기</a>
      </div>

      <nav class="tabs">
        <button class="tab active" data-tab="proposals">제안함</button>
        <button class="tab" data-tab="drafts">초안 읽기</button>
        <button class="tab" data-tab="threads">쓰레드 글</button>
        <button class="tab" data-tab="records">기록</button>
        <button class="tab" data-tab="meeting">다음 모임</button>
      </nav>

      <div id="tab-proposals"></div>
      <div id="tab-drafts" class="hidden"></div>
      <div id="tab-threads" class="hidden"></div>
      <div id="tab-records" class="hidden"></div>
      <div id="tab-meeting" class="hidden">
        <form class="card inquiry-form" id="meeting-form">
          <p class="form-note">여기에 저장하면 첫 화면 '다음 모임'에 바로 보여요. 링크만 있으면 누구나 볼 수 있으니 연락처·회의 링크는 적지 말아 주세요.</p>
          <label for="m-date">날짜</label>
          <input id="m-date" type="date" required>
          <label for="m-time">시간</label>
          <input id="m-time" type="time">
          <label for="m-place">장소</label>
          <input id="m-place" type="text" placeholder="예: ○○도서관 세미나실 / 온라인">
          <label for="m-book">책 제목</label>
          <input id="m-book" type="text" placeholder="예: 책 제목" required>
          <label for="m-author">지은이</label>
          <input id="m-author" type="text" placeholder="예: 지은이">
          <label for="m-presenter">발제자</label>
          <input id="m-presenter" type="text" placeholder="예: 김○○ 선생님">
          <label for="m-note">안내 한마디</label>
          <textarea id="m-note" rows="3" placeholder="예: 이번엔 1~3장까지 함께 읽어요. 다 못 읽어도 편하게 오세요."></textarea>
          <button class="btn" type="submit">저장하기</button>
        </form>
      </div>
    </section>
  </main>

  <script src="assets/config.js"></script>
  <script src="assets/data.js"></script>
  <script src="assets/sheet-api.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
