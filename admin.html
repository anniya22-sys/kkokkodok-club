<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>관리 페이지</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="admin">
  <header class="topbar">
    <div class="wrap">
      <a class="logo" href="./">관리 페이지</a>
      <a class="btn small ghost" href="./">공개 페이지</a>
    </div>
  </header>

  <main class="wrap">
    <!-- 접근 코드 입력 -->
    <section class="gate card" id="gate">
      <h3>접근 코드 입력</h3>
      <p>4주차부터 Apps Script에서 접근 코드를 확인합니다.</p>
      <input type="password" id="code" placeholder="접근 코드">
      <button class="btn" id="enter">들어가기</button>
    </section>

    <section id="console" class="hidden">
      <div class="notice">3주차 연습 모드: 예시 데이터로 동작합니다. 새로고침하면 처음 상태로 돌아갑니다.</div>

      <nav class="tabs">
        <button class="tab active" data-tab="proposals">제안함</button>
        <button class="tab" data-tab="drafts">초안 검수</button>
        <button class="tab" data-tab="threads">쓰레드 변환</button>
        <button class="tab" data-tab="records">기록</button>
      </nav>

      <div id="tab-proposals"></div>
      <div id="tab-drafts" class="hidden"></div>
      <div id="tab-threads" class="hidden"></div>
      <div id="tab-records" class="hidden"></div>
    </section>
  </main>

  <script src="assets/data.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
