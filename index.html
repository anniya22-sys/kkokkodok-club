<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>브랜드 콘텐츠 허브</title>
  <meta name="description" content="브랜드 소개와 발행 콘텐츠 모음">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="public">
  <header class="topbar">
    <div class="wrap">
      <a class="logo" id="brand-name" href="./">브랜드</a>
      <a class="btn small" id="contact-top" href="#">문의하기</a>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <div class="hero-text">
        <div class="label">소개</div>
        <h1 id="brand-definition">브랜드 한 문장 정의</h1>
        <p id="brand-audience"></p>
        <a class="btn" id="contact-hero" href="#">문의하기</a>
      </div>
      <img class="hero-img" src="assets/book.svg" alt="">
    </section>

    <section class="section">
      <h2>핵심 서비스</h2>
      <div class="grid" id="services"></div>
    </section>

    <section class="section" id="books">
      <h2>책 추천</h2>
      <p class="section-desc">함께 읽고 싶은 책을 자유롭게 추천해 주세요.</p>
      <div class="grid" id="book-list"></div>
      <form class="card inquiry-form book-form" id="book-form">
        <label for="book-title">책 제목</label>
        <input id="book-title" type="text" placeholder="예: 책 제목" required>
        <label for="book-author">저자</label>
        <input id="book-author" type="text" placeholder="예: 지은이">
        <label for="book-by">추천한 사람</label>
        <input id="book-by" type="text" placeholder="예: 김선생">
        <label for="book-reason">추천 이유</label>
        <textarea id="book-reason" rows="3" placeholder="이 책을 함께 읽고 싶은 이유를 한두 줄로 적어 주세요." required></textarea>
        <button class="btn" type="submit">추천하기</button>
      </form>
    </section>

    <section class="section">
      <h2>콘텐츠</h2>
      <ul class="post-list" id="posts"></ul>
    </section>

    <section class="section" id="inquiry">
      <h2>문의하기</h2>
      <form class="card inquiry-form" id="inquiry-form">
        <label for="inquiry-name">이름</label>
        <input id="inquiry-name" type="text" placeholder="예: 김선생" required>
        <label for="inquiry-message">문의 내용</label>
        <textarea id="inquiry-message" rows="5" placeholder="궁금한 점을 편하게 남겨 주세요." required></textarea>
        <p class="form-note">연락처·학생 이름 같은 개인정보는 적지 말아 주세요.</p>
        <button class="btn" type="submit">보내기</button>
        <p class="form-done hidden" id="inquiry-done">접수되었습니다. 남겨 주셔서 고맙습니다.</p>
      </form>
    </section>
  </main>

  <footer>
    <div class="wrap" id="footer-text"></div>
  </footer>

  <script src="assets/data.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
